
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHOVARAM AI OCTAPAD MAKER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#101323;color:white;
 font-family:Arial,sans-serif;
}
.container{
 max-width:600px;margin:auto;
 background:#1d2340;padding:22px;
 border-radius:20px;
}
h1{text-align:center;color:#48e6c1}
p{text-align:center;color:#c4c9dc}
input,button{
 width:100%;padding:15px;
 margin:10px 0;border-radius:10px;
 border:0;font-size:16px;
}
button{
 background:#48e6c1;color:#101323;
 font-weight:bold;
}
.pads{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:10px;margin-top:20px;
}
.pad{
 background:#343d65;padding:22px 5px;
 text-align:center;border-radius:12px;
}
.status{
 background:#11172a;padding:15px;
 border-radius:10px;margin-top:15px;
}
</style>
</head>
<body>
<div class="container">
<h1>CHOVARAM AI</h1>
<p>OCTAPAD MAKER</p>

<h3>🎵 YouTube गाने का लिंक</h3>
<input id="youtube" type="url"
placeholder="YouTube लिंक यहाँ डालें">

<h3>🎧 अपना गाना अपलोड करें</h3>
<input id="song" type="file"
accept="audio/*">

<button onclick="analyze()">AI MUSIC ANALYZE</button>

<div class="status" id="status">
आपका गाना विश्लेषण के लिए तैयार है।
</div>

<h3>🥁 OCTAPAD SOUND PADS</h3>
<div class="pads">
<div class="pad">PAD 1</div>
<div class="pad">PAD 2</div>
<div class="pad">PAD 3</div>
<div class="pad">PAD 4</div>
<div class="pad">PAD 5</div>
<div class="pad">PAD 6</div>
<div class="pad">PAD 7</div>
<div class="pad">PAD 8</div>
</div>

<button onclick="downloadSong()">DOWNLOAD AUDIO</button>
</div>

<script>
function analyze(){
 const link=document.getElementById("youtube").value;
 const file=document.getElementById("song").files[0];

 if(!link && !file){
 alert("पहले गाने का लिंक या ऑडियो फाइल डालें");
 return;
 }

 document.getElementById("status").innerText=
 "गाना प्राप्त हुआ। AI Backend अभी जोड़ा जाना बाकी है।";
}
function downloadSong(){
 const file=document.getElementById("song").files[0];
 if(!file){
 alert("पहले ऑडियो फाइल अपलोड करें");
 return;
 }
 const a=document.createElement("a");
 a.href=URL.createObjectURL(file);
 a.download=file.name;
 a.click();
 URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
